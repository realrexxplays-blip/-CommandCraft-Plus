name: Build CommandCore+
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build Fabric
        run: gradle :fabric:build --no-daemon
      - name: Build NeoForge
        run: gradle :neoforge:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CommandCore-Plus-JARs
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
