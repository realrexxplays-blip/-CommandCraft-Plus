plugins { id "fabric-loom" }
base { archivesName = "CommandCraft-Plus-Fabric" }
dependencies {
    minecraft "com.mojang:minecraft:26.3"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.162.0+26.3"
}
sourceSets.main.java.srcDir("../common/src/main/java")
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
